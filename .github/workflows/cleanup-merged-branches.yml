name: Cleanup merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches already merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          while IFS= read -r ref; do
            branch="${ref#origin/}"

            if [[ "$branch" == "HEAD" || "$branch" == "main" ]]; then
              continue
            fi

            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Keeping unmerged branch: $branch"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort)
